<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".5" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a0008"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc143c"/>
      <stop offset="1" stop-color="#7a0a22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dc143c" stroke-width=".3" opacity=".15"/>
    </pattern>
  </defs>

  <rect width="800" height="240" fill="url(#bg)"/>
  <rect width="800" height="240" fill="url(#grid)"/>

  <g opacity=".4">
    <line x1="0" y1="60" x2="800" y2="60" stroke="#dc143c" stroke-width=".5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#dc143c" stroke-width=".5"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#dc143c" stroke-width=".5"/>
    <line x1="100" y1="0" x2="100" y2="240" stroke="#dc143c" stroke-width=".3"/>
    <line x1="250" y1="0" x2="250" y2="240" stroke="#dc143c" stroke-width=".3"/>
    <line x1="400" y1="0" x2="400" y2="240" stroke="#dc143c" stroke-width=".5"/>
    <line x1="550" y1="0" x2="550" y2="240" stroke="#dc143c" stroke-width=".3"/>
    <line x1="700" y1="0" x2="700" y2="240" stroke="#dc143c" stroke-width=".3"/>
  </g>

  <g transform="translate(60 50)">
    <polygon points="0,80 40,40 80,80 40,120" fill="none" stroke="url(#crimson)" stroke-width="1.5" filter="url(#glow)"/>
    <polygon points="0,80 40,40 80,80 40,120" fill="#dc143c" opacity=".08"/>
    <circle cx="40" cy="80" r="4" fill="#dc143c" filter="url(#strongGlow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(660 50)">
    <polygon points="0,80 40,40 80,80 40,120" fill="none" stroke="url(#crimson)" stroke-width="1.5" filter="url(#glow)"/>
    <polygon points="0,80 40,40 80,80 40,120" fill="#dc143c" opacity=".08"/>
    <circle cx="40" cy="80" r="4" fill="#dc143c" filter="url(#strongGlow)">
      <animate attributeName="r" values="3;6;3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Courier New, monospace" font-weight="900" text-anchor="middle">
    <text x="400" y="140" font-size="86" fill="url(#crimson)" filter="url(#strongGlow)" letter-spacing="8">ETRNKZ</text>
    <text x="400" y="140" font-size="86" fill="#fff" opacity=".9" letter-spacing="8" transform="translate(0 -1)">ETRNKZ</text>
  </g>

  <g font-family="Courier New, monospace" text-anchor="middle">
    <text x="400" y="170" font-size="11" fill="#888" letter-spacing="6">// REVERSE ENGINEER :: BOT ENG :: ETH/GOBA</text>
  </g>

  <g font-family="Courier New, monospace" font-size="9" fill="#555" letter-spacing="2">
    <text x="20" y="20">SYS://etrnkz.profile</text>
    <text x="780" y="20" text-anchor="end">v0.0x</text>
    <text x="20" y="230">[ 0x45 0x54 0x52 0x4E 0x4B 0x5A ]</text>
    <text x="780" y="230" text-anchor="end" fill="#00c853">● ONLINE</text>
  </g>

  <g>
    <circle cx="20" cy="30" r="2" fill="#dc143c">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="30" r="2" fill="#dc143c">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin=".5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="30" r="2" fill="#dc143c">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#dc143c" stroke-width="1" fill="none" opacity=".6">
    <path d="M 60 200 L 60 215 L 740 215 L 740 200" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
