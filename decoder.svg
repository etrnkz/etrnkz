<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260">
  <defs>
    <style>
      @keyframes scan { 0%{transform:translateY(0);opacity:0} 10%{opacity:.35} 90%{opacity:.35} 100%{transform:translateY(220px);opacity:0} }
      @keyframes pop { 0%{opacity:0;transform:scale(.2) rotateY(90deg)} 60%{opacity:1;transform:scale(1.08) rotateY(0)} 100%{opacity:1;transform:scale(1) rotateY(0)} }
      @keyframes glow { 0%,100%{opacity:.4;filter:drop-shadow(0 0 0 transparent)} 50%{opacity:1;filter:drop-shadow(0 0 12px #dc143c)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
      @keyframes fill { 0%{width:0} 100%{width:480} }
      @keyframes pulse { 0%,100%{opacity:0} 50%{opacity:.6} }
      @keyframes grid { 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }
      @keyframes glitch {
        0%,95%,100%{transform:translate(0)}
        96%{transform:translate(-3px,2px)}
        97%{transform:translate(3px,-1px)}
        98%{transform:translate(-2px,1px)}
        99%{transform:translate(2px,-2px)}
      }
      @keyframes particle { 0%{transform:translateY(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-60px);opacity:0} }
      .scanline { animation:scan 3.5s ease-in-out infinite }
      .cell { opacity:0; animation:pop .6s ease-out forwards }
      .c2 { animation-delay:.3s } .c3 { animation-delay:.5s }
      .c4 { animation-delay:.7s } .c5 { animation-delay:.9s } .c6 { animation-delay:1.1s }
      .arrow { animation:float 2s ease-in-out infinite }
      .glow { animation:glow 2.5s ease-in-out infinite }
      .bar { animation:fill 2.5s ease-out .5s forwards }
      .grid-line { stroke-dasharray:8 8; animation:grid 20s linear infinite }
      .glitch { animation:glitch 6s ease-in-out infinite }
      .particle { animation:particle 3s ease-out infinite }
      .p2 { animation-delay:-1s }
      .p3 { animation-delay:-2s }
      .pulse { animation:pulse 2s ease-in-out infinite }
    </style>
  </defs>

  <rect width="700" height="260" fill="#050505"/>
  <rect width="700" height="260" fill="url(#bg)" opacity=".5"/>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none"/>
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f0f0f" stroke-width=".5" class="grid-line"/>
  </pattern>
  <rect width="700" height="260" fill="url(#grid)"/>

  <line class="scanline" x1="0" y1="0" x2="700" y2="0" stroke="#dc143c" stroke-width="1"/>

  <g opacity=".15">
    <circle class="particle p1" cx="50" cy="200" r="1.5" fill="#dc143c"/>
    <circle class="particle p2" cx="150" cy="180" r="1" fill="#dc143c"/>
    <circle class="particle p3" cx="300" cy="220" r="1.2" fill="#dc143c"/>
    <circle class="particle p2" cx="500" cy="190" r="1.5" fill="#dc143c"/>
    <circle class="particle p3" cx="600" cy="210" r="1" fill="#dc143c"/>
    <circle class="particle p1" cx="650" cy="170" r="1.2" fill="#dc143c"/>
  </g>

  <path d="M0,0 h22 M0,0 v22" stroke="#dc143c" stroke-width="2.5" fill="none"/>
  <path d="M700,0 h-22 M700,0 v22" stroke="#dc143c" stroke-width="2.5" fill="none"/>
  <path d="M0,260 h22 M0,260 v-22" stroke="#dc143c" stroke-width="2.5" fill="none"/>
  <path d="M700,260 h-22 M700,260 v-22" stroke="#dc143c" stroke-width="2.5" fill="none"/>

  <text x="350" y="32" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#333" letter-spacing="4">
    DECODING IDENTITY
  </text>

  <!-- E -->
  <g class="cell"><rect x="52" y="50" width="82" height="100" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="52" y="50" width="82" height="100" fill="#080808" rx="2" opacity=".9"/>
    <text x="93" y="74" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#444">0x45</text>
    <text class="arrow" x="93" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow glitch" x="93" y="130" text-anchor="middle" font-family="'Courier New',monospace" font-size="38" font-weight="900" fill="#dc143c">E</text>
  </g>

  <!-- T -->
  <g class="cell c2"><rect x="148" y="50" width="82" height="100" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="148" y="50" width="82" height="100" fill="#080808" rx="2" opacity=".9"/>
    <text x="189" y="74" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#444">0x54</text>
    <text class="arrow" x="189" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow glitch" x="189" y="130" text-anchor="middle" font-family="'Courier New',monospace" font-size="38" font-weight="900" fill="#dc143c">T</text>
  </g>

  <!-- R -->
  <g class="cell c3"><rect x="244" y="50" width="82" height="100" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="244" y="50" width="82" height="100" fill="#080808" rx="2" opacity=".9"/>
    <text x="285" y="74" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#444">0x52</text>
    <text class="arrow" x="285" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow glitch" x="285" y="130" text-anchor="middle" font-family="'Courier New',monospace" font-size="38" font-weight="900" fill="#dc143c">R</text>
  </g>

  <!-- N -->
  <g class="cell c4"><rect x="340" y="50" width="82" height="100" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="340" y="50" width="82" height="100" fill="#080808" rx="2" opacity=".9"/>
    <text x="381" y="74" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#444">0x4E</text>
    <text class="arrow" x="381" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow glitch" x="381" y="130" text-anchor="middle" font-family="'Courier New',monospace" font-size="38" font-weight="900" fill="#dc143c">N</text>
  </g>

  <!-- K -->
  <g class="cell c5"><rect x="436" y="50" width="82" height="100" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="436" y="50" width="82" height="100" fill="#080808" rx="2" opacity=".9"/>
    <text x="477" y="74" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#444">0x4B</text>
    <text class="arrow" x="477" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow glitch" x="477" y="130" text-anchor="middle" font-family="'Courier New',monospace" font-size="38" font-weight="900" fill="#dc143c">K</text>
  </g>

  <!-- Z -->
  <g class="cell c6"><rect x="532" y="50" width="82" height="100" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="532" y="50" width="82" height="100" fill="#080808" rx="2" opacity=".9"/>
    <text x="573" y="74" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#444">0x5A</text>
    <text class="arrow" x="573" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow glitch" x="573" y="130" text-anchor="middle" font-family="'Courier New',monospace" font-size="38" font-weight="900" fill="#dc143c">Z</text>
  </g>

  <text x="20" y="210" font-family="'Courier New',monospace" font-size="8" fill="#333" letter-spacing="3">DECODING</text>
  <text x="680" y="210" text-anchor="end" font-family="'Courier New',monospace" font-size="8" fill="#333" letter-spacing="3">
    <tspan fill="#dc143c">0x</tspan>100%
  </text>

  <rect x="100" y="220" width="500" height="1" fill="#111"/>
  <rect class="bar" x="100" y="220" height="1" fill="#dc143c"/>
  <rect class="pulse" x="100" y="219" width="2" height="3" fill="#dc143c"/>

  <text x="350" y="243" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#222" letter-spacing="2">
    ETRNKZ v2.4.1 [REVERSE ENGINEERING SUITE]
  </text>
</svg>
