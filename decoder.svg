<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240">
  <defs>
    <style>
      @keyframes scan { 0%{transform:translateY(0);opacity:0} 8%{opacity:.4} 92%{opacity:.4} 100%{transform:translateY(200px);opacity:0} }
      @keyframes pop { 0%{opacity:0;transform:scale(.1) rotateY(180deg)} 50%{opacity:1;transform:scale(1.12) rotateY(0)} 70%{transform:scale(.95)} 100%{opacity:1;transform:scale(1)} }
      @keyframes glow { 0%,100%{opacity:.3;filter:drop-shadow(0 0 0 transparent)} 50%{opacity:1;filter:drop-shadow(0 0 15px #dc143c)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      @keyframes fill { 0%{width:0} 100%{width:490} }
      @keyframes cursor { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes typing { 0%{width:0} 30%{width:120} 70%{width:120} 100%{width:0} }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes dataStream { 0%{transform:translateY(-60px);opacity:0} 20%{opacity:.06} 80%{opacity:.06} 100%{transform:translateY(300px);opacity:0} }
      .scanline { animation:scan 3s ease-in-out infinite }
      .cell { opacity:0; animation:pop .7s cubic-bezier(.175,.885,.32,1.275) forwards }
      .c1 { animation-delay:.2s } .c2 { animation-delay:.4s } .c3 { animation-delay:.6s }
      .c4 { animation-delay:.8s } .c5 { animation-delay:1s } .c6 { animation-delay:1.2s }
      .arrow { animation:float 2.5s ease-in-out infinite }
      .glow { animation:glow 2s ease-in-out infinite }
      .bar { animation:fill 2.2s ease-out .8s forwards }
      .cursor { animation:cursor 1s step-end infinite }
      .stream { animation:dataStream 4s linear infinite }
      .s2 { animation-delay:-1s } .s3 { animation-delay:-2s } .s4 { animation-delay:-3s }
      .typing { overflow:hidden;white-space:nowrap;animation:typing 4s steps(30) infinite }
      .pulse { animation:blink 2s ease-in-out infinite }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="240" fill="#050505"/>
  <rect width="720" height="240" fill="#080808" rx="0"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r=".5" fill="#151515"/>
  </pattern>
  <rect width="720" height="240" fill="url(#dots)"/>

  <!-- Data streams -->
  <g opacity=".04" font-family="'Courier New',monospace" font-size="8" fill="#dc143c">
    <text class="stream" x="30" y="0">01 10 00 11 01 10 00 11</text>
    <text class="stream s2" x="180" y="0">11 00 10 01 11 00 10 01</text>
    <text class="stream s3" x="350" y="0">00 11 01 10 00 11 01 10</text>
    <text class="stream s4" x="520" y="0">10 01 11 00 10 01 11 00</text>
    <text class="stream s3" x="640" y="0">01 10 00 11 01 10 00 11</text>
  </g>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="28" fill="#0a0a0a" stroke="#151515" stroke-width="1"/>
  <circle cx="18" cy="14" r="4" fill="#333"/>
  <circle cx="32" cy="14" r="4" fill="#333"/>
  <circle cx="46" cy="14" r="4" fill="#dc143c" opacity=".4"/>
  <text x="360" y="18" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#444" letter-spacing="4">REVERSE ENGINEERING SUITE &mdash; DECODE v2.4.1</text>

  <!-- Corner accents -->
  <path d="M0,28 h16 M0,28 v16" stroke="#dc143c" stroke-width="2" fill="none" opacity=".6"/>
  <path d="M720,28 h-16 M720,28 v16" stroke="#dc143c" stroke-width="2" fill="none" opacity=".6"/>
  <path d="M0,240 h16 M0,240 v-16" stroke="#dc143c" stroke-width="2" fill="none" opacity=".6"/>
  <path d="M720,240 h-16 M720,240 v-16" stroke="#dc143c" stroke-width="2" fill="none" opacity=".6"/>

  <!-- Scan line -->
  <line class="scanline" x1="0" y1="28" x2="720" y2="28" stroke="#dc143c" stroke-width="1" opacity=".3"/>

  <!-- E -->
  <g class="cell c1">
    <rect x="32" y="44" width="84" height="96" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="34" y="46" width="80" height="92" fill="none" stroke="#111" stroke-width="1" rx="1"/>
    <text x="74" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#555">0x45</text>
    <line x1="52" y1="78" x2="96" y2="78" stroke="#1a1a1a" stroke-width="1"/>
    <text class="arrow" x="74" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow" x="74" y="126" text-anchor="middle" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#dc143c" filter="url(#glow)">E</text>
  </g>

  <!-- T -->
  <g class="cell c2">
    <rect x="128" y="44" width="84" height="96" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="130" y="46" width="80" height="92" fill="none" stroke="#111" stroke-width="1" rx="1"/>
    <text x="170" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#555">0x54</text>
    <line x1="148" y1="78" x2="192" y2="78" stroke="#1a1a1a" stroke-width="1"/>
    <text class="arrow" x="170" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow" x="170" y="126" text-anchor="middle" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#dc143c" filter="url(#glow)">T</text>
  </g>

  <!-- R -->
  <g class="cell c3">
    <rect x="224" y="44" width="84" height="96" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="226" y="46" width="80" height="92" fill="none" stroke="#111" stroke-width="1" rx="1"/>
    <text x="266" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#555">0x52</text>
    <line x1="244" y1="78" x2="288" y2="78" stroke="#1a1a1a" stroke-width="1"/>
    <text class="arrow" x="266" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow" x="266" y="126" text-anchor="middle" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#dc143c" filter="url(#glow)">R</text>
  </g>

  <!-- N -->
  <g class="cell c4">
    <rect x="320" y="44" width="84" height="96" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="322" y="46" width="80" height="92" fill="none" stroke="#111" stroke-width="1" rx="1"/>
    <text x="362" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#555">0x4E</text>
    <line x1="340" y1="78" x2="384" y2="78" stroke="#1a1a1a" stroke-width="1"/>
    <text class="arrow" x="362" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow" x="362" y="126" text-anchor="middle" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#dc143c" filter="url(#glow)">N</text>
  </g>

  <!-- K -->
  <g class="cell c5">
    <rect x="416" y="44" width="84" height="96" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="418" y="46" width="80" height="92" fill="none" stroke="#111" stroke-width="1" rx="1"/>
    <text x="458" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#555">0x4B</text>
    <line x1="436" y1="78" x2="480" y2="78" stroke="#1a1a1a" stroke-width="1"/>
    <text class="arrow" x="458" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow" x="458" y="126" text-anchor="middle" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#dc143c" filter="url(#glow)">K</text>
  </g>

  <!-- Z -->
  <g class="cell c6">
    <rect x="512" y="44" width="84" height="96" fill="none" stroke="#1a1a1a" stroke-width="1" rx="2"/>
    <rect x="514" y="46" width="80" height="92" fill="none" stroke="#111" stroke-width="1" rx="1"/>
    <text x="554" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#555">0x5A</text>
    <line x1="532" y1="78" x2="576" y2="78" stroke="#1a1a1a" stroke-width="1"/>
    <text class="arrow" x="554" y="90" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc143c">&#x25BC;</text>
    <text class="glow" x="554" y="126" text-anchor="middle" font-family="'Courier New',monospace" font-size="36" font-weight="900" fill="#dc143c" filter="url(#glow)">Z</text>
  </g>

  <!-- Status bar -->
  <rect x="0" y="155" width="720" height="24" fill="#0a0a0a" stroke="#151515" stroke-width="1"/>

  <text class="typing" x="20" y="171" font-family="'Courier New',monospace" font-size="9" fill="#555" letter-spacing="2">
    <tspan fill="#dc143c">>></tspan> IDENTITY DECODED: E T R N K Z
  </text>

  <!-- Bottom progress -->
  <text x="20" y="209" font-family="'Courier New',monospace" font-size="9" fill="#444" letter-spacing="2">DECODING</text>
  <text x="700" y="209" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#444" letter-spacing="2">
    <tspan fill="#dc143c">0x</tspan>100%
  </text>

  <rect x="100" y="217" width="520" height="1" fill="#151515"/>
  <rect class="bar" x="100" y="217" height="1" fill="#dc143c"/>
  <rect class="pulse" x="100" y="216" width="2" height="3" fill="#dc143c"/>

  <text x="700" y="233" text-anchor="end" font-family="'Courier New',monospace" font-size="7" fill="#222" letter-spacing="2">
    <tspan class="cursor" fill="#dc143c">&#x2588;</tspan>
  </text>
</svg>
